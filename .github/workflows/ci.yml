name: Checks
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Rust
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - name: Rust formatting
        run: cargo +1.96.1 fmt --check
      - name: Rust lint
        run: cargo +1.96.1 clippy --locked --all-targets --all-features -- -D warnings
      - name: Rust tests
        run: cargo +1.96.1 test --locked --all-targets --all-features
      - name: Packaging tests
        run: node --test packaging/tests/*.test.cjs
