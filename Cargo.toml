[package]
name = "devmap"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Evidence-backed development maps for humans and AI agents"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

[dev-dependencies]
tempfile = "3.21"

