[package]
name = "devmap"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
description = "Evidence-backed development maps for humans and AI agents"
license = "Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
getrandom = "0.3"
libc = "0.2"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "process"] }

[dev-dependencies]
tempfile = "3.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_ProcessSnapshotting", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
