<!doctype html>
<html lang="en" data-density="map">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevMap Git Work Map</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f7; --bg-canvas: #fafbfc; --surface: #ffffff; --surface-raised: #f5f8fc;
      --line: #d9dde3; --line-soft: #e9ebef; --text: #202124; --muted: #6f747c; --faint: #9aa0a8;
      --main-rail: #202124; --accent: #1677ff; --accent-soft: #eaf3ff; --success: #20b26b; --warning: #d99013;
      --danger: #d92d54; --unknown: #89919b; --focus: #1677ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 0; min-height: 100%; overflow-x: hidden; background: var(--bg); color: var(--text); }
    body { font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    button { font: inherit; touch-action: manipulation; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .skip-link { position: fixed; z-index: 20; top: 8px; left: 8px; padding: 8px 12px; transform: translateY(-160%); border-radius: 8px; background: var(--text); color: var(--bg); }
    .skip-link:focus { transform: translateY(0); }
    .shell { container-type: inline-size; width: min(1440px, 100%); margin: 0 auto; padding: 24px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 4px 14px; }
    .eyebrow { margin: 0 0 2px; color: var(--text); font-size: 17px; font-weight: 800; letter-spacing: -.015em; text-transform: none; }
    h1 { margin: 0; font-size: 14px; line-height: 1.25; letter-spacing: -.01em; }
    .subhead { margin: 5px 0 0; color: var(--muted); font: 11px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }
    .masthead-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
    .refresh { min-width: 82px; min-height: 34px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; font-size: 11px; font-weight: 700; box-shadow: 0 1px 2px rgb(32 33 36 / 6%); }
    .refresh:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .refresh:disabled { cursor: wait; opacity: .62; }
    .overview { display: flex; flex-wrap: wrap; align-items: center; gap: 0; margin: 0; }
    .metric { display: flex; align-items: baseline; gap: 6px; min-width: 0; padding: 0 14px; border-right: 1px solid var(--line); background: transparent; }
    .metric:first-child { padding-left: 0; }
    .metric:last-child { border-right: 0; }
    .metric strong { font-size: 14px; font-variant-numeric: tabular-nums; }
    .metric span { color: var(--muted); font-size: 10px; }
    .toolbar-side { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 14px; }
    .connection { margin: 0; color: var(--success); font: 700 10px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .connection.offline { color: var(--warning); }
    .density-switch { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: #f1f3f5; box-shadow: inset 0 1px 2px rgb(32 33 36 / 4%); }
    .density-button { min-height: 32px; padding: 5px 9px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font: 750 10px/1 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .density-button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(32 33 36 / 12%), inset 0 0 0 1px var(--line); }
    .legend { display: none; flex-wrap: wrap; justify-content: flex-end; gap: 8px 12px; color: var(--muted); font-size: 11px; }
    html[data-density="full"] .legend { display: flex; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--unknown); }
    .dot.root { background: var(--main-rail); } .dot.dev { background: var(--accent); }
    .dot.open { background: var(--warning); } .dot.dirty { background: var(--danger); }
    .map-frame { --identity-width: 250px; --target-width: 142px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); box-shadow: 0 10px 28px rgb(32 33 36 / 7%); }
    .map-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 52px; padding: 9px 14px; border-bottom: 1px solid var(--line-soft); background: var(--surface); }
    .map-title-group { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px; min-width: 0; }
    .topology-viewport { position: relative; width: 100%; height: min(68vh, 720px); min-height: 420px; overflow-x: auto; overflow-y: auto; scrollbar-gutter: stable; overscroll-behavior-inline: contain; background: var(--bg-canvas); cursor: grab; }
    .topology-viewport:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
    .topology-viewport.is-panning { cursor: grabbing; user-select: none; }
    .topology-canvas, .topology-surface { display: grid; width: var(--topology-width, 1080px); min-width: var(--topology-width, 1080px); background: var(--bg-canvas); }
    .rail-section { --rail-color: var(--main-rail); position: relative; min-width: 0; padding: 18px 18px 24px; border-bottom: 1px solid var(--line-soft); background: var(--bg-canvas); }
    .rail-section:last-child { border-bottom: 0; }
    .rail-section.development { --rail-color: var(--accent); }
    .topology-grid-labels { display: grid; grid-template-columns: var(--identity-width) minmax(560px, 1fr) 132px var(--target-width); gap: 12px; margin: 0 0 8px; color: var(--faint); font: 700 8px/1.3 ui-monospace, "Cascadia Code", Consolas, monospace; letter-spacing: .08em; }
    .topology-grid-labels span:last-child { text-align: right; }
    .integration-rail { display: grid; grid-template-columns: var(--identity-width) minmax(720px, 1fr); align-items: center; gap: 18px; min-height: 48px; }
    .rail-node { position: sticky; left: 18px; z-index: 7; min-height: 42px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text); cursor: pointer; text-align: left; box-shadow: 0 1px 3px rgb(32 33 36 / 7%); }
    .rail-node[aria-current="true"] { border-color: var(--rail-color); background: var(--surface); box-shadow: 0 0 0 3px var(--accent-soft); }
    .rail-node strong { display: block; overflow-wrap: anywhere; }
    .rail-node span { display: block; color: var(--muted); font: 10px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .rail-line, .worktree-stage { display: grid; grid-template-columns: repeat(var(--station-count), minmax(300px, 1fr)); }
    .rail-line, .worktree-stage { padding-right: var(--target-width); }
    .rail-line { position: relative; height: 2px; border-radius: 99px; background: var(--rail-color); }
    .timeline-station, .fork-group { grid-column: span var(--station-span); }
    .timeline-station { position: relative; inset: auto; z-index: 2; justify-self: center; width: 44px; min-width: 44px; height: 44px; min-height: 44px; padding: 0; transform: none; border: 0; background: transparent; cursor: pointer; }
    .timeline-station::after { content: ""; position: absolute; top: 50%; left: 50%; width: 12px; height: 12px; transform: translate(-50%, -50%); border: 2px solid var(--rail-color); border-radius: 50%; background: var(--surface); }
    .timeline-station:hover::after, .timeline-station:focus-visible::after { box-shadow: 0 0 0 4px var(--accent-soft); }
    .timeline-head { position: absolute; top: 50%; right: -1px; display: grid; place-items: center; min-width: 47px; min-height: 22px; padding: 0 10px; transform: translateY(-50%); border-radius: 999px; background: var(--rail-color); color: var(--surface); font: 800 9px/1 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .rail-parent { margin: 4px 0 4px calc(var(--identity-width) + 18px); color: var(--faint); font: 9px/1.4 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .worktree-stage { position: relative; gap: 0; margin-top: 4px; margin-left: calc(var(--identity-width) + 18px); min-width: 0; }
    .fork-group { position: relative; display: grid; align-content: start; gap: 1px; min-width: 0; padding: 5px 0 2px; }
    .fork-group::before { content: ""; position: absolute; top: -9px; width: 2px; height: 38px; transform: translateX(-50%); border-radius: 99px; background: var(--accent); }
    .fork-group::before { left: 50%; }
    .fork-node { position: relative; z-index: 2; justify-self: center; min-height: 18px; margin: 0; padding: 1px 5px; transform: none; border: 0; border-radius: 4px; background: var(--bg-canvas); color: var(--faint); cursor: pointer; text-align: center; font: 650 8px/1.15 ui-monospace, "Cascadia Code", Consolas, monospace; box-shadow: none; }
    .fork-group.unknown .fork-node { border-style: dashed; color: var(--unknown); }
    .fork-node[aria-current="true"] { color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
    .station-title { display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
    .station-title strong { color: var(--text); font-family: inherit; }
    .station-count { color: var(--faint); }
    .station-meta { display: none; }
    .branch-list { display: grid; grid-template-columns: repeat(var(--station-span), 272px); align-items: start; justify-content: center; gap: 20px; min-width: 0; }
    .worktree-cluster { position: relative; display: grid; grid-template-rows: auto auto auto auto; align-content: start; width: 272px; min-width: 272px; }
    .worktree-stem { justify-self: center; width: 2px; height: 28px; background: var(--accent); }
    .workspace-branch.current { position: relative; }
    .workspace-branch.current .worktree-stop { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .worktree-stop, .task-node { position: relative; z-index: 2; min-width: 0; min-height: 32px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--text); cursor: pointer; text-align: left; box-shadow: 0 1px 2px rgb(32 33 36 / 4%); }
    .worktree-stop { align-self: center; justify-self: stretch; width: auto; margin-left: 0; }
    .worktree-identity { position: relative; left: auto; z-index: 6; width: 100%; margin: 0; padding-left: 10px; background: var(--surface); box-shadow: 0 1px 2px rgb(32 33 36 / 4%); }
    .worktree-stop:hover, .task-node:hover, .fork-node:hover, .rail-node:hover { border-color: var(--accent); }
    .worktree-stop[aria-current="true"], .task-node[aria-current="true"] { border-color: var(--accent); background: var(--surface-raised); box-shadow: 0 0 0 2px var(--accent-soft); }
    .branch-name { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; font-size: 10px; font-weight: 780; overflow-wrap: anywhere; }
    .current-pill { padding: 1px 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 9px; letter-spacing: .05em; }
    .workspace-short, .task-meta { display: block; margin-top: 3px; color: var(--muted); font: 10px/1.35 ui-monospace, "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }
    .worktree-state { margin: 6px 0 0; color: var(--muted); font: 800 9px/1.3 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .worktree-state.dirty { color: var(--danger); }
    .agent-roster { position: relative; display: grid; gap: 6px; margin: 8px 0 0 18px; padding-left: 16px; border-left: 2px solid var(--line); }
    .task-node, .conversation-node { min-width: 0; min-height: 44px; padding: 7px 9px; }
    .agent-task-node { width: 100%; min-height: 52px; }
    .task-title, .conversation-title { display: block; font-size: 11px; font-weight: 760; overflow-wrap: anywhere; }
    .conversation-facts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 7px; margin-top: 3px; }
    .agent-identity { color: var(--text); font: 700 9px/1.3 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .task-state, .conversation-state { color: var(--accent); font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .agent-task-node.history .conversation-state { color: var(--faint); }
    .task-node.idle .task-state, .conversation-node.idle .conversation-state, .conversation-node.completed .conversation-state, .conversation-node.stale .conversation-state { color: var(--muted); }
    .conversation-context, .conversation-audit { display: block; margin-top: 3px; color: var(--muted); font: 9px/1.35 ui-monospace, "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }
    .historical-conversations { width: 100%; min-height: 44px; padding: 7px 10px; border: 1px dashed var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); cursor: pointer; font-size: 10px; }
    .historical-conversations:hover { border-color: var(--accent); color: var(--text); }
    .unlinked { min-height: 38px; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); }
    .unlinked strong, .unlinked span { display: block; }
    .unlinked strong { font-size: 11px; } .unlinked span { font-size: 9px; }
    html[data-density="map"] .workspace-short, html[data-density="map"] .conversation-context, html[data-density="map"] .conversation-audit { display: none; }
    html[data-density="read"] .conversation-audit { display: none; }
    html[data-density="read"] .task-meta { display: none; }
    .return-state { position: relative; z-index: 2; align-self: stretch; display: grid; align-content: center; min-height: 38px; margin-top: 10px; padding: 5px 8px; border: 0; color: var(--unknown); font-size: 9px; font-weight: 800; background: var(--bg-canvas); }
    .return-state::before { content: ""; position: absolute; bottom: 100%; left: 50%; height: 10px; border-left: 2px dashed var(--unknown); }
    .return-state.merged { color: #12804b; background: var(--bg-canvas); }
    .return-state.merged::before { border-color: var(--success); border-style: solid; }
    .return-state.unmerged { color: #9a620a; background: var(--bg-canvas); }
    .counts { display: block; margin-top: 2px; color: var(--muted); font: 9px/1.35 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .collapsed-branches { grid-column: 1 / -1; justify-self: start; min-height: 38px; margin: 8px 0 0; padding: 7px 11px; border: 1px dashed var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); cursor: pointer; font-size: 11px; }
    .collapsed-branches:hover { border-color: var(--accent); color: var(--text); }
    .selection-details { margin: 0; padding: 16px; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: var(--surface); box-shadow: inset 0 1px 0 rgb(255 255 255 / 75%); }
    .selection-details h2 { margin: 0 0 10px; font-size: 16px; }
    .detail-empty { margin: 0; color: var(--muted); }
    .detail-grid { display: grid; grid-template-columns: minmax(110px, .4fr) minmax(0, 1.6fr); gap: 6px 12px; margin: 0; }
    .detail-grid dt { color: var(--muted); }
    .detail-grid dd { margin: 0; overflow-wrap: anywhere; }
    .detail-grid code { user-select: text; font: 11px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; }
    .copy-hash { min-height: 44px; margin-top: 12px; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 8px; background: var(--accent-soft); color: var(--text); cursor: pointer; }
    .warnings { margin: 12px 0 0; padding: 10px 12px; border: 1px solid var(--warning); border-radius: 10px; background: #fff9ec; color: #8c5a08; }
    .empty { margin: 0; padding: 20px; color: var(--muted); }
    @container (max-width: 619px) {
      .shell { padding: 12px; }
      .map-frame { --identity-width: 214px; --target-width: 130px; }
      .masthead { align-items: flex-start; flex-direction: column; }
      .masthead-actions { width: 100%; justify-content: space-between; }
      .map-toolbar { grid-template-columns: minmax(0, 1fr); }
      .toolbar-side, .legend { justify-content: flex-start; }
      .rail-section { padding: 14px 12px 18px; }
      .rail-parent { margin-left: 0; }
      .detail-grid { grid-template-columns: minmax(0, 1fr); }
      .detail-grid dd { margin-bottom: 6px; }
    }
    @container (max-width: 360px) { .overview { gap: 8px 0; } .metric { flex: 1 1 auto; } }
    @media (pointer: coarse) { button { min-height: 44px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#dock-main">Skip to Git relationship map</a>
  <div class="shell">
    <header class="masthead">
      <div><p class="eyebrow">DevMap · Rail View</p><p class="subhead" id="revision">Waiting for a valid snapshot</p></div>
      <div class="masthead-actions"><p class="connection" id="connection" aria-live="polite">CONNECTING · no update yet</p><button class="refresh" id="refresh" type="button">Refresh all</button></div>
    </header>
    <main id="dock-main" tabindex="-1">
      <section class="map-frame" aria-labelledby="map-title">
        <div class="map-toolbar">
          <div class="map-title-group">
            <h1 id="map-title">Repository topology</h1>
            <div class="overview" aria-label="Relationship summary">
              <div class="metric"><strong id="metric-workspaces">0</strong><span>Workspaces</span></div>
              <div class="metric"><strong id="metric-tasks">0</strong><span>Linked chats</span></div>
              <div class="metric"><strong id="metric-open">0</strong><span>Not merged</span></div>
            </div>
          </div>
          <div class="toolbar-side">
            <div class="density-switch" id="density-switch" aria-label="Detail density">
              <button class="density-button" type="button" data-density-value="map" aria-label="MAP density" aria-pressed="true">MAP</button>
              <button class="density-button" type="button" data-density-value="read" aria-label="READ density" aria-pressed="false">READ</button>
              <button class="density-button" type="button" data-density-value="full" aria-label="FULL density" aria-pressed="false">FULL</button>
            </div>
            <div class="legend" aria-label="Map legend"><span><i class="dot root"></i>Main rail</span><span><i class="dot dev"></i>Development rail</span><span><i class="dot open"></i>Not merged</span><span><i class="dot dirty"></i>Dirty</span></div>
          </div>
        </div>
        <div class="topology-viewport" id="topology-viewport" tabindex="0" aria-label="Scrollable repository topology">
          <div class="relationship-map topology-canvas topology-surface" id="relationship-map"></div>
        </div>
        <section class="selection-details" id="selection-details" aria-labelledby="selection-title">
          <h2 id="selection-title">Selection details</h2><p class="detail-empty">Select a common-base station, workspace, or task.</p>
        </section>
      </section>
      <p class="warnings" id="warnings" role="status" hidden></p>
    </main>
  </div>
  <script>
    (() => {
      "use strict";
      const MAX_ROWS = 2048, MAX_TEXT = 16384, MAX_TAGS = 32, MAX_VISIBLE_BRANCHES = 6;
      const MAX_RECENT_HISTORY = 3;
      const REFRESH_PROMPT = "Refresh DevMap task inventory for the current local repository and update the open Dock.";
      const transport = window.parent === window ? "browser" : "mcp";
      const browserQuery = transport === "browser" ? window.location.search : "";
      const pendingRequests = new Map();
      const pendingNavigationNodes = new Map();
      const allowedStatus = new Set(["starting", "working", "waiting", "idle", "completed", "stale", "unknown"]);
      const allowedConfidence = new Set(["observed", "leased", "inferred", "unknown"]);
      const allowedSources = new Set(["config", "local_dev", "local_develop", "remote_default", "local_main", "local_master"]);
      let nextRequestId = 1, renderedRevision = -1, lastValidAt = 0, refreshTimer, ageTimer, eventStream;
      let lastTaskInventorySync = null, requestedTaskInventorySync = null, refreshRequestTimer;
      const expandedTargets = new Set();
      const expandedConversationHistory = new Set();
      const activeConversationStates = new Set(["starting", "working", "waiting", "active"]);
      const byId = (id) => document.getElementById(id);
      const boundedText = (value) => typeof value === "string" && value.length > 0 && value.length <= MAX_TEXT;
      const optionalText = (value) => value === null || value === undefined || boundedText(value);
      const safeHash = (value) => typeof value === "string" && (/^[0-9a-f]{40}$/.test(value) || /^[0-9a-f]{64}$/.test(value));
      const safeRouteId = (value) => value === null || value === undefined || /^[A-Za-z0-9][A-Za-z0-9._:/-]{0,511}$/.test(value);
      const safeCodexThreadId = (value) => value === null || value === undefined
        || (typeof value === "string" && /^[A-Za-z0-9][A-Za-z0-9-]{0,255}$/.test(value));
      const safeCount = (value) => value === null || (Number.isSafeInteger(value) && value >= 0);
      function validTask(task) {
        return task && typeof task === "object" && boundedText(task.session_id) && boundedText(task.display_title)
          && boundedText(task.actor_id) && boundedText(task.host) && optionalText(task.host_status)
          && safeRouteId(task.route_id) && safeCodexThreadId(task.codex_thread_id) && allowedStatus.has(task.status) && allowedConfidence.has(task.confidence)
          && boundedText(task.last_event_at) && typeof task.capture_incomplete === "boolean"
          && (task.association_source === "presence_worktree_id" || task.association_source === "codex_task_cwd");
      }
      function validFork(fork) {
        return fork && typeof fork === "object" && boundedText(fork.target_branch) && safeHash(fork.commit)
          && Array.isArray(fork.tags) && fork.tags.length <= MAX_TAGS && fork.tags.every(boundedText)
          && optionalText(fork.subject) && optionalText(fork.authored_at) && safeCount(fork.distance_to_target);
      }
      function validRelationship(value) {
        return value && typeof value === "object" && optionalText(value.base_target) && optionalText(value.merge_target)
          && (value.merged === null || typeof value.merged === "boolean") && safeCount(value.ahead) && safeCount(value.behind)
          && typeof value.dirty === "boolean" && Number.isSafeInteger(value.changed_file_count) && value.changed_file_count >= 0
          && (value.fork_point === null || validFork(value.fork_point));
      }
      function validLane(lane) {
        return lane && typeof lane === "object" && /^wt-[0-9a-f]{64}$/.test(lane.worktree_id)
          && boundedText(lane.workspace_path) && optionalText(lane.branch) && safeHash(lane.head)
          && typeof lane.is_current === "boolean" && validRelationship(lane.relationship)
          && Array.isArray(lane.chats) && lane.chats.length <= MAX_ROWS && lane.chats.every(validTask);
      }
      function validRail(rail) {
        return rail && typeof rail === "object" && boundedText(rail.name) && boundedText(rail.ref_name)
          && safeHash(rail.head) && optionalText(rail.parent) && allowedSources.has(rail.source);
      }
      function validGroup(group) {
        return group && typeof group === "object" && boundedText(group.target_branch)
          && typeof group.terminal === "boolean" && (group.fork_point === null || validFork(group.fork_point))
          && Array.isArray(group.lanes) && group.lanes.length <= MAX_ROWS && group.lanes.every(validLane);
      }

      function setOffline() { const node = byId("connection"); node.className = "connection offline"; const age = lastValidAt ? formatAge(Date.now() - lastValidAt) : "never"; node.textContent = `OFFLINE · last update ${age}`; scheduleAge(); }
      function formatAge(milliseconds) { if (!Number.isFinite(milliseconds)) return "unknown"; const seconds = Math.max(0, Math.floor(milliseconds / 1000)); return seconds < 60 ? `${seconds}s ago` : `${Math.floor(seconds / 60)}m ago`; }
      function scheduleAge() { clearTimeout(ageTimer); if (document.visibilityState === "visible") ageTimer = setTimeout(() => { if (lastValidAt && Date.now() - lastValidAt > 6000) setOffline(); else scheduleAge(); }, 1000); }
      async function fetchSnapshot() { try { const response = await fetch(`/api/v1/dock/snapshot${browserQuery}`, { cache: "no-store" }); if (!response.ok || !acceptSnapshot(await response.json())) throw new Error("invalid snapshot"); } catch (_) { setOffline(); } }
      function connectEvents() {
        if (eventStream) eventStream.close(); eventStream = new EventSource(`/api/v1/dock/events${browserQuery}`);
        eventStream.addEventListener("dock", (event) => { try { if (!acceptSnapshot(JSON.parse(event.data))) setOffline(); } catch (_) { setOffline(); } });
        eventStream.addEventListener("error", () => { if (!lastValidAt || Date.now() - lastValidAt > 6000) setOffline(); });
      }
      function installPanControls(viewport) {
        let pointer = null;
        const stopPointer = () => { pointer = null; viewport.classList.remove("is-panning"); };
        viewport.addEventListener("pointerdown", (event) => {
          if (event.button !== 0 || event.target.closest("button, a, input, textarea, select, [data-no-pan]")) return;
          pointer = { id: event.pointerId, x: event.clientX, scrollLeft: viewport.scrollLeft };
          viewport.setPointerCapture(event.pointerId); viewport.classList.add("is-panning");
        });
        viewport.addEventListener("pointermove", (event) => {
          if (!pointer || pointer.id !== event.pointerId) return;
          viewport.scrollLeft = pointer.scrollLeft - (event.clientX - pointer.x);
        });
        viewport.addEventListener("pointerup", stopPointer);
        viewport.addEventListener("pointercancel", stopPointer);
        viewport.addEventListener("lostpointercapture", stopPointer);
        viewport.addEventListener("wheel", (event) => {
          if (!event.shiftKey || event.deltaY === 0) return;
          const maximum = Math.max(0, viewport.scrollWidth - viewport.clientWidth);
          const next = Math.max(0, Math.min(maximum, viewport.scrollLeft + event.deltaY));
          if (next === viewport.scrollLeft) return;
          event.preventDefault(); viewport.scrollLeft = next;
        }, { passive: false });
        viewport.addEventListener("keydown", (event) => {
          if (event.target !== viewport) return;
          const page = Math.max(160, Math.round(viewport.clientWidth * .72));
          const destination = event.key === "ArrowLeft" ? viewport.scrollLeft - page
            : event.key === "ArrowRight" ? viewport.scrollLeft + page
              : event.key === "Home" ? 0 : event.key === "End" ? viewport.scrollWidth : null;
          if (destination === null) return;
          event.preventDefault();
          viewport.scrollTo({ left: destination, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" });
        });
      }
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return; const message = event.data; if (message?.jsonrpc !== "2.0") return;
        if (message.method === "ui/notifications/tool-result") { if (!acceptSnapshot(message.params?.structuredContent)) setOffline(); return; }
        if (pendingRequests.has(message.id)) { const pending = pendingRequests.get(message.id); pendingRequests.delete(message.id);
          if (pending === "ui/initialize" && message.result) { post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }); callTool("devmap_dock_snapshot", {}); scheduleRefresh(); }
          else if (pending === "task-navigation") {
            const node = pendingNavigationNodes.get(message.id);
            pendingNavigationNodes.delete(message.id);
            if (node) releaseNavigationNode(node);
            announce(message.error ? "Codex task could not be opened" : "Opening Codex task…");
            return;
          }
          else if (pending === "ui/message") { if (message.error) gitOnlyRefresh(); }
          else if (!acceptSnapshot(message.result?.structuredContent)) setOffline(); }
      });
      document.addEventListener("visibilitychange", () => {
        clearTimeout(refreshTimer); clearTimeout(ageTimer); if (eventStream) eventStream.close();
        if (document.visibilityState === "visible") { if (transport === "mcp") { callTool("devmap_dock_snapshot", {}); scheduleRefresh(); } else { fetchSnapshot(); connectEvents(); } scheduleAge(); }
      });
      byId("refresh").addEventListener("click", requestFullRefresh);
      for (const control of byId("density-switch").querySelectorAll("[data-density-value]")) control.addEventListener("click", () => setDensity(control.dataset.densityValue));
      installPanControls(byId("topology-viewport"));
      setDensity("map", false);
      if (transport === "mcp") initializeMcp(); else { fetchSnapshot(); connectEvents(); } scheduleAge();
    })();
  </script>
</body>
</html>
