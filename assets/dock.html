<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevMap Live Worktree Dock</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f172a;
      --surface: #172033;
      --surface-strong: #202b40;
      --text: #f8fafc;
      --muted: #aebbd0;
      --border: #526078;
      --accent: #4ade80;
      --accent-soft: #153b2a;
      --warning: #fbbf24;
      --warning-soft: #453411;
      --danger: #fda4af;
      --danger-soft: #4c1d2a;
      --focus: #93c5fd;
      --radius: 10px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-width: 0; min-height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font-size: 0.875rem; line-height: 1.5; }
    button { font: inherit; }
    .shell { container-type: inline-size; min-height: 100dvh; padding: var(--space-3); }
    .skip-link { position: fixed; left: var(--space-3); top: -80px; z-index: 10; padding: var(--space-2); background: var(--text); color: var(--bg); }
    .skip-link:focus { top: var(--space-3); }
    .masthead { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); }
    .eyebrow { margin: 0 0 var(--space-1); color: var(--accent); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.2rem, 4cqi, 1.6rem); line-height: 1.2; letter-spacing: -0.025em; }
    .subhead { margin: var(--space-1) 0 0; color: var(--muted); }
    .refresh { min-width: 48px; min-height: 48px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); cursor: pointer; transition: background-color 180ms ease, border-color 180ms ease; }
    .refresh:hover { background: var(--surface-strong); border-color: var(--accent); }
    .refresh:active { background: var(--accent-soft); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); margin-bottom: var(--space-4); }
    .metric { min-width: 0; padding: var(--space-2); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
    .metric strong { display: block; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
    .metric span { color: var(--muted); font-size: 0.72rem; }
    .connection { min-height: 1.5rem; margin: 0 0 var(--space-3); color: var(--muted); font-variant-numeric: tabular-nums; }
    .connection.offline { color: var(--warning); font-weight: 650; }
    .group { margin: 0 0 var(--space-4); }
    .group-heading { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-2); }
    h2 { margin: 0; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .rows { display: grid; gap: var(--space-2); }
    .empty { margin: 0; padding: var(--space-3); border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted); }
    .row { width: 100%; min-height: 52px; padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); text-align: left; cursor: pointer; transition: background-color 180ms ease, border-color 180ms ease; }
    .row:hover { background: var(--surface-strong); }
    .row[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
    .row-top, .row-meta { display: flex; align-items: center; min-width: 0; gap: var(--space-2); }
    .row-top { justify-content: space-between; }
    .identity { min-width: 0; overflow: hidden; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .branch { margin-top: var(--space-1); overflow-wrap: anywhere; color: var(--muted); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 0.76rem; }
    .row-meta { flex-wrap: wrap; margin-top: var(--space-2); color: var(--muted); font-size: 0.72rem; }
    .label { color: var(--text); font-weight: 650; }
    .badge { flex: none; padding: 2px 7px; border: 1px solid currentColor; border-radius: 999px; color: var(--muted); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .status-working, .status-starting, .status-idle { color: var(--accent); background: var(--accent-soft); }
    .status-waiting, .status-stale { color: var(--warning); background: var(--warning-soft); }
    .status-completed, .status-unknown { color: var(--muted); }
    .capture-warning { color: var(--danger); background: var(--danger-soft); }
    .warnings { margin: var(--space-4) 0 0; padding: var(--space-3); border: 1px solid var(--warning); border-radius: var(--radius); background: var(--warning-soft); color: #fde68a; }
    .warnings[hidden] { display: none; }

    @container (max-width: 330px) {
      .summary { grid-template-columns: 1fr; }
      .masthead { align-items: center; }
      .row-top { align-items: flex-start; }
    }

    @container (min-width: 680px) {
      #groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); align-items: start; }
      .group { margin-bottom: 0; }
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f1f5f9;
        --surface: #ffffff;
        --surface-strong: #e8eef6;
        --text: #0f172a;
        --muted: #475569;
        --border: #94a3b8;
        --accent: #166534;
        --accent-soft: #dcfce7;
        --warning: #92400e;
        --warning-soft: #fef3c7;
        --danger: #9f1239;
        --danger-soft: #ffe4e6;
        --focus: #1d4ed8;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#dock-main">Skip to worktrees</a>
  <div class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Live local state</p>
        <h1>Worktree Dock</h1>
        <p class="subhead" id="revision">Waiting for a valid snapshot</p>
      </div>
      <button class="refresh" id="refresh" type="button" aria-label="Refresh worktree status">Refresh</button>
    </header>

    <div class="summary" aria-label="Worktree summary">
      <div class="metric"><strong id="metric-current">0</strong><span>Current</span></div>
      <div class="metric"><strong id="metric-active">0</strong><span>Active</span></div>
      <div class="metric"><strong id="metric-attention">0</strong><span>Needs attention</span></div>
    </div>

    <p class="connection" id="connection" aria-live="polite">CONNECTING · no update yet</p>

    <main id="dock-main" tabindex="-1">
      <div id="groups">
        <section class="group" aria-labelledby="current-heading">
          <div class="group-heading"><h2 id="current-heading">Current</h2><span class="count" id="current-count">0</span></div>
          <div class="rows" id="current-rows"></div>
        </section>
        <section class="group" aria-labelledby="active-heading">
          <div class="group-heading"><h2 id="active-heading">Active</h2><span class="count" id="active-count">0</span></div>
          <div class="rows" id="active-rows"></div>
        </section>
        <section class="group" aria-labelledby="stale-heading">
          <div class="group-heading"><h2 id="stale-heading">Stale or uninstrumented</h2><span class="count" id="stale-count">0</span></div>
          <div class="rows" id="stale-rows"></div>
        </section>
      </div>
      <p class="warnings" id="warnings" role="status" hidden></p>
    </main>
  </div>

  <script>
    (() => {
      "use strict";
      const MAX_ROWS = 2048;
      const MAX_TEXT = 16384;
      const transport = window.parent === window ? "browser" : "mcp";
      const browserQuery = transport === "browser" ? window.location.search : "";
      const pendingRequests = new Map();
      let nextRequestId = 1;
      let renderedRevision = -1;
      let lastValidAt = 0;
      let refreshTimer;
      let ageTimer;
      let eventStream;
      let selectedWorktreeId = null;

      const byId = (id) => document.getElementById(id);
      const boundedText = (value) => typeof value === "string" && value.length > 0 && value.length <= MAX_TEXT;
      const optionalText = (value) => value === null || value === undefined || boundedText(value);
      const safeRouteId = (value) => value === null || value === undefined || /^[A-Za-z0-9][A-Za-z0-9._:/-]{0,511}$/.test(value);
      const allowedStatus = new Set(["starting", "working", "waiting", "idle", "completed", "stale", "unknown"]);
      const allowedConfidence = new Set(["observed", "leased", "inferred", "unknown"]);

      function post(message) {
        window.parent.postMessage(message, "*");
      }

      function callTool(name, args) {
        if (pendingRequests.size > 1) return null;
        const id = nextRequestId++;
        pendingRequests.set(id, name);
        post({ jsonrpc: "2.0", id, method: "tools/call", params: { name, arguments: args } });
        return id;
      }

      function initializeMcp() {
        const id = nextRequestId++;
        pendingRequests.set(id, "ui/initialize");
        post({
          jsonrpc: "2.0",
          id,
          method: "ui/initialize",
          params: {
            protocolVersion: "2026-07-28",
            capabilities: {},
            clientInfo: { name: "devmap-dock", version: "1" }
          }
        });
      }

      function scheduleRefresh(delay = 2000) {
        clearTimeout(refreshTimer);
        if (document.visibilityState === "visible" && transport === "mcp") {
          refreshTimer = setTimeout(() => {
            callTool("devmap_dock_snapshot", {});
            scheduleRefresh(2000);
          }, Math.max(2000, delay));
        }
      }

      function validRow(row) {
        return row && typeof row === "object"
          && /^wt-[0-9a-f]{64}$/.test(row.worktree_id)
          && optionalText(row.actor_id)
          && optionalText(row.branch)
          && safeRouteId(row.route_id)
          && boundedText(row.display_path)
          && allowedStatus.has(row.status)
          && allowedConfidence.has(row.confidence)
          && typeof row.capture_incomplete === "boolean";
      }

      function acceptSnapshot(value) {
        if (!value || value.schema_version !== "devmap/dock/1") return false;
        if (!Number.isSafeInteger(value.revision) || value.revision < renderedRevision) return false;
        if (!/^sha256-[0-9a-f]{64}$/.test(value.repository_id)) return false;
        if (!/^wt-[0-9a-f]{64}$/.test(value.current_worktree_id)) return false;
        let totalRows = 0;
        for (const key of ["current", "active", "stale_or_uninstrumented"]) {
          if (!Array.isArray(value[key]) || value[key].length > 2048) return false;
          totalRows += value[key].length;
          if (totalRows > MAX_ROWS || value[key].some((row) => !validRow(row))) return false;
        }
        if (!Array.isArray(value.warnings) || value.warnings.length > MAX_ROWS
            || value.warnings.some((warning) => !warning || !boundedText(warning.code)
              || !optionalText(warning.subject_id))) return false;
        renderedRevision = value.revision;
        lastValidAt = Date.now();
        renderSnapshot(value);
        setOnline();
        return true;
      }

      function renderSnapshot(value) {
        byId("revision").textContent = `Revision ${value.revision} · ${value.repository_id.slice(0, 18)}…`;
        byId("metric-current").textContent = String(value.current.length);
        byId("metric-active").textContent = String(value.active.length);
        byId("metric-attention").textContent = String(value.stale_or_uninstrumented.length + value.warnings.length);
        renderGroup("current", value.current);
        renderGroup("active", value.active);
        renderGroup("stale", value.stale_or_uninstrumented);
        const warning = byId("warnings");
        warning.hidden = value.warnings.length === 0 && !value.truncated;
        warning.textContent = value.truncated
          ? `PARTIAL VIEW · ${value.warnings.length} integrity warning(s)`
          : `${value.warnings.length} integrity warning(s)`;
      }

      function renderGroup(prefix, rows) {
        byId(`${prefix}-count`).textContent = String(rows.length);
        const container = byId(`${prefix}-rows`);
        const fragment = document.createDocumentFragment();
        if (rows.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "No worktrees in this group";
          fragment.append(empty);
        }
        for (const row of rows) fragment.append(createRow(row));
        container.replaceChildren(fragment);
      }

      function createRow(row) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "row";
        button.dataset.worktreeId = row.worktree_id;
        button.setAttribute("aria-pressed", String(row.worktree_id === selectedWorktreeId));
        button.setAttribute("aria-label", `Select ${row.actor_id || "uninstrumented worktree"}; Status ${row.status}; Confidence ${row.confidence}`);

        const top = document.createElement("span");
        top.className = "row-top";
        const identity = document.createElement("span");
        identity.className = "identity";
        identity.textContent = row.actor_id || "Uninstrumented worktree";
        const status = document.createElement("span");
        status.className = `badge status-${row.status}`;
        status.textContent = row.status;
        top.append(identity, status);

        const branch = document.createElement("span");
        branch.className = "branch";
        branch.textContent = row.branch || "detached HEAD";
        branch.title = row.display_path;

        const meta = document.createElement("span");
        meta.className = "row-meta";
        appendMeta(meta, "Status", row.status);
        appendMeta(meta, "Confidence", row.confidence);
        if (row.capture_incomplete) {
          const incomplete = document.createElement("span");
          incomplete.className = "badge capture-warning";
          incomplete.textContent = "CAPTURE INCOMPLETE";
          meta.append(incomplete);
        }
        button.append(top, branch, meta);
        button.addEventListener("click", () => selectRow(row));
        return button;
      }

      function appendMeta(container, label, value) {
        const item = document.createElement("span");
        const strong = document.createElement("span");
        strong.className = "label";
        strong.textContent = `${label}: `;
        item.append(strong, document.createTextNode(value));
        container.append(item);
      }

      function selectRow(row) {
        selectedWorktreeId = row.worktree_id;
        document.querySelectorAll(".row").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.worktreeId === row.worktree_id));
        });
        if (transport === "mcp") {
          post({
            jsonrpc: "2.0",
            method: "ui/update-model-context",
            params: {
              content: [{
                type: "text",
                text: `DevMap selection: worktree_id=${row.worktree_id} route_id=${row.route_id || "none"}`
              }]
            }
          });
        }
      }

      function setOnline() {
        const node = byId("connection");
        node.className = "connection";
        node.textContent = "LIVE · updated now";
        scheduleAge();
      }

      function setOffline() {
        const node = byId("connection");
        node.className = "connection offline";
        const age = lastValidAt ? formatAge(Date.now() - lastValidAt) : "never";
        node.textContent = `OFFLINE · last update ${age}`;
        scheduleAge();
      }

      function formatAge(milliseconds) {
        if (!Number.isFinite(milliseconds)) return "unknown";
        const seconds = Math.max(0, Math.floor(milliseconds / 1000));
        return seconds < 60 ? `${seconds}s ago` : `${Math.floor(seconds / 60)}m ago`;
      }

      function scheduleAge() {
        clearTimeout(ageTimer);
        if (document.visibilityState === "visible") {
          ageTimer = setTimeout(() => {
            if (lastValidAt && Date.now() - lastValidAt > 6000) setOffline();
            else scheduleAge();
          }, 1000);
        }
      }

      async function fetchSnapshot() {
        try {
          const response = await fetch(`/api/v1/dock/snapshot${browserQuery}`, { cache: "no-store" });
          if (!response.ok || !acceptSnapshot(await response.json())) throw new Error("invalid snapshot");
        } catch (_) {
          setOffline();
        }
      }

      function connectEvents() {
        if (eventStream) eventStream.close();
        eventStream = new EventSource(`/api/v1/dock/events${browserQuery}`);
        eventStream.addEventListener("dock", (event) => {
          try {
            if (!acceptSnapshot(JSON.parse(event.data))) setOffline();
          } catch (_) {
            setOffline();
          }
        });
        eventStream.addEventListener("error", setOffline);
      }

      window.addEventListener("message", (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (message?.jsonrpc !== "2.0") return;
        if (message.method === "ui/notifications/tool-result") {
          if (!acceptSnapshot(message.params?.structuredContent)) setOffline();
          return;
        }
        if (pendingRequests.has(message.id)) {
          const pending = pendingRequests.get(message.id);
          pendingRequests.delete(message.id);
          if (pending === "ui/initialize" && message.result) {
            post({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} });
            callTool("devmap_dock_snapshot", {});
            scheduleRefresh();
          } else if (!acceptSnapshot(message.result?.structuredContent)) {
            setOffline();
          }
        }
      });

      document.addEventListener("visibilitychange", () => {
        clearTimeout(refreshTimer);
        clearTimeout(ageTimer);
        if (eventStream) eventStream.close();
        if (document.visibilityState === "visible") {
          if (transport === "mcp") {
            callTool("devmap_dock_snapshot", {});
            scheduleRefresh();
          } else {
            fetchSnapshot();
            connectEvents();
          }
          scheduleAge();
        }
      });

      byId("refresh").addEventListener("click", () => {
        if (transport === "mcp") callTool("devmap_dock_snapshot", {});
        else fetchSnapshot();
      });

      if (transport === "mcp") initializeMcp();
      else {
        fetchSnapshot();
        connectEvents();
      }
      scheduleAge();
    })();
  </script>
</body>
</html>
