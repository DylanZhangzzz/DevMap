<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
<title id="title">CodeGraph 如何工作</title>
<desc id="desc">源码事实 · 固定提交 195888d · 索引、自动核对与查询入口</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect width="1440" height="1020" fill="#f8fafc"/>
<rect x="50" y="45" width="52" height="5" rx="2" fill="#30916c"/>
<text x="50" y="102" font-size="38" fill="#172c43" font-weight="700">CodeGraph 如何工作</text>
<text x="50" y="140" font-size="17" fill="#586a81" font-weight="400">源码事实 · 固定提交 195888d · 索引、自动核对与查询入口</text>
<path d="M350,237 L390,237" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M690,237 L730,237" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1030,237 L1070,237" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M370,430 L370,360 L540,360 L540,305" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="427.0" y="350.0" font-size="14" fill="#40526a" font-weight="400">重新提取</text>
<path d="M1180,305 L1180,365 L880,365 L880,430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1016.0" y="355.0" font-size="14" fill="#40526a" font-weight="400">检索</text>
<path d="M1300,305 L1300,430" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1312.0" y="367.5" font-size="14" fill="#40526a" font-weight="400">读取</text>
<path d="M880,575 L880,680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1230,575 L1230,680" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="50" y="170" width="300" height="135" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="68" y="205" font-size="21" fill="#172c43" font-weight="700">源文件</text>
<text x="68" y="231" font-size="17" fill="#40526a" font-weight="400">当前文件系统</text>
<text x="68" y="256" font-size="17" fill="#40526a" font-weight="400">语言、路径、内容与修改时间</text>
<rect x="390" y="170" width="300" height="135" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="408" y="205" font-size="21" fill="#172c43" font-weight="700">提取符号</text>
<text x="408" y="231" font-size="17" fill="#40526a" font-weight="400">TypeScript 编排</text>
<text x="408" y="256" font-size="17" fill="#40526a" font-weight="400">Rust kernel / WASM 后备</text>
<text x="408" y="281" font-size="17" fill="#40526a" font-weight="400">节点 + 尚未解析的引用</text>
<rect x="730" y="170" width="300" height="135" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="748" y="205" font-size="21" fill="#172c43" font-weight="700">解析跨文件关系</text>
<text x="748" y="231" font-size="17" fill="#40526a" font-weight="400">调用 / 导入 / 继承</text>
<text x="748" y="256" font-size="17" fill="#40526a" font-weight="400">保留未解析引用</text>
<text x="748" y="281" font-size="17" fill="#40526a" font-weight="400">变更后修复失效关系</text>
<rect x="1070" y="170" width="320" height="135" rx="12" fill="#e7f3ee" stroke="#30916c" stroke-width="1.5"/>
<text x="1088" y="205" font-size="21" fill="#172c43" font-weight="700">SQLite 索引</text>
<text x="1088" y="231" font-size="17" fill="#40526a" font-weight="400">nodes / edges / files</text>
<text x="1088" y="256" font-size="17" fill="#40526a" font-weight="400">unresolved_refs / FTS5</text>
<text x="1088" y="281" font-size="17" fill="#40526a" font-weight="400">本地 WAL 数据库</text>
<rect x="50" y="430" width="640" height="145" rx="12" fill="#eaf2ff" stroke="#6488c1" stroke-width="1.5"/>
<text x="68" y="465" font-size="21" fill="#172c43" font-weight="700">自动同步与补核对</text>
<text x="68" y="491" font-size="17" fill="#40526a" font-weight="400">watcher 防抖 → 精确路径核对；范围不明时完整核对</text>
<text x="68" y="516" font-size="17" fill="#40526a" font-weight="400">size / mtime 预筛 → 内容哈希 → 增量提取</text>
<text x="68" y="541" font-size="17" fill="#40526a" font-weight="400">重连补同步；不只依赖 git status</text>
<rect x="730" y="430" width="300" height="145" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="748" y="465" font-size="21" fill="#172c43" font-weight="700">相关上下文</text>
<text x="748" y="491" font-size="17" fill="#40526a" font-weight="400">搜索入口 → 图遍历</text>
<text x="748" y="516" font-size="17" fill="#40526a" font-weight="400">按深度、节点和源码预算</text>
<text x="748" y="541" font-size="17" fill="#40526a" font-weight="400">返回结构化结果</text>
<rect x="1070" y="430" width="320" height="145" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1088" y="465" font-size="21" fill="#172c43" font-weight="700">UI HTTP API</text>
<text x="1088" y="491" font-size="17" fill="#40526a" font-weight="400">读取同一项目索引</text>
<text x="1088" y="516" font-size="17" fill="#40526a" font-weight="400">另有 trails JSON 写入</text>
<text x="1088" y="541" font-size="17" fill="#40526a" font-weight="400">浏览器不直接访问数据库</text>
<rect x="50" y="680" width="640" height="145" rx="12" fill="#fff4e4" stroke="#c49245" stroke-width="1.5"/>
<text x="68" y="715" font-size="21" fill="#172c43" font-weight="700">边界必须看源码</text>
<text x="68" y="741" font-size="17" fill="#40526a" font-weight="400">补同步有超时后继续服务的路径</text>
<text x="68" y="766" font-size="17" fill="#40526a" font-weight="400">pending 提示不等于永不过期</text>
<text x="68" y="791" font-size="17" fill="#40526a" font-weight="400">新库快建可丢弃；不适合直接搬到决策库</text>
<rect x="730" y="680" width="300" height="100" rx="12" fill="#eff0fc" stroke="#9295c8" stroke-width="1.5"/>
<text x="748" y="715" font-size="21" fill="#172c43" font-weight="700">MCP / CLI</text>
<text x="748" y="741" font-size="17" fill="#40526a" font-weight="400">向 Agent 提供检索结果</text>
<rect x="1070" y="680" width="320" height="100" rx="12" fill="#eff0fc" stroke="#9295c8" stroke-width="1.5"/>
<text x="1088" y="715" font-size="21" fill="#172c43" font-weight="700">浏览器</text>
<text x="1088" y="741" font-size="17" fill="#40526a" font-weight="400">查看代码关系与源码</text>
<rect x="50" y="880" width="1340" height="90" rx="12" fill="#edf1f6" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="68" y="915" font-size="21" fill="#172c43" font-weight="700">运行组织</text>
<text x="68" y="941" font-size="17" fill="#40526a" font-weight="400">共享后台按项目复用 MCPEngine；每个客户端有 MCPSession / proxy；UI 服务可独立运行。</text>
</g>
</svg>