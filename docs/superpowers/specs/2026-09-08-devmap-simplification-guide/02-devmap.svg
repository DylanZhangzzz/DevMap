<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
<title id="title">DevMap 简化后的技术框架</title>
<desc id="desc">建议方案 · 本机、单用户、仓库级存储 · 复用现有 Rust 领域核心</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect width="1440" height="1040" fill="#f8fafc"/>
<rect x="50" y="45" width="52" height="5" rx="2" fill="#30916c"/>
<text x="50" y="102" font-size="38" fill="#172c43" font-weight="700">DevMap 简化后的技术框架</text>
<text x="50" y="140" font-size="17" fill="#586a81" font-weight="400">建议方案 · 本机、单用户、仓库级存储 · 复用现有 Rust 领域核心</text>
<path d="M250,280 L250,355" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M720,280 L720,355" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1190,280 L1190,355" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M250,465 L250,545" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="262.0" y="505.0" font-size="14" fill="#40526a" font-weight="400">领域命令 / 观察批次</text>
<path d="M450,607 L520,607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M920,607 L990,607" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1190,670 L1190,770" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1202.0" y="720.0" font-size="14" fill="#40526a" font-weight="400">一致读快照</text>
<rect x="50" y="170" width="400" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="68" y="205" font-size="21" fill="#172c43" font-weight="700">Git 观察</text>
<text x="68" y="231" font-size="17" fill="#40526a" font-weight="400">refs / HEAD / worktree / 拓扑</text>
<text x="68" y="256" font-size="17" fill="#40526a" font-weight="400">真实开发状态的来源</text>
<rect x="520" y="170" width="400" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="538" y="205" font-size="21" fill="#172c43" font-weight="700">宿主 / Agent 观察</text>
<text x="538" y="231" font-size="17" fill="#40526a" font-weight="400">任务、会话、活动、覆盖范围</text>
<text x="538" y="256" font-size="17" fill="#40526a" font-weight="400">保留来源与缺口</text>
<rect x="990" y="170" width="400" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1008" y="205" font-size="21" fill="#172c43" font-weight="700">用户意图</text>
<text x="1008" y="231" font-size="17" fill="#40526a" font-weight="400">路线、目标、里程碑、撤回</text>
<text x="1008" y="256" font-size="17" fill="#40526a" font-weight="400">无法单靠 Git 重建</text>
<rect x="50" y="355" width="1340" height="110" rx="12" fill="#eaf2ff" stroke="#6488c1" stroke-width="1.5"/>
<text x="68" y="390" font-size="21" fill="#172c43" font-weight="700">统一接入与校验</text>
<text x="68" y="416" font-size="17" fill="#40526a" font-weight="400">解析 repository / worktree incarnation · 校验来源和幂等键 · 明确观察时间 · 不从相似路径猜关联</text>
<rect x="50" y="545" width="400" height="125" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="68" y="580" font-size="21" fill="#172c43" font-weight="700">应用服务 / 领域规则</text>
<text x="68" y="606" font-size="17" fill="#40526a" font-weight="400">版本冲突检查与事件去重</text>
<text x="68" y="631" font-size="17" fill="#40526a" font-weight="400">写队列 → 短事务 → 提交确认</text>
<text x="68" y="656" font-size="17" fill="#40526a" font-weight="400">计划、事实和未知保持分离</text>
<rect x="520" y="545" width="400" height="125" rx="12" fill="#e7f3ee" stroke="#30916c" stroke-width="1.5"/>
<text x="538" y="580" font-size="21" fill="#172c43" font-weight="700">devmap.db</text>
<text x="538" y="606" font-size="17" fill="#40526a" font-weight="400">&lt;git-common-dir&gt;/devmap/</text>
<text x="538" y="631" font-size="17" fill="#40526a" font-weight="400">持久记录 + 可重建投影</text>
<text x="538" y="656" font-size="17" fill="#40526a" font-weight="400">SQLite WAL / 默认 FULL</text>
<rect x="990" y="545" width="400" height="125" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1008" y="580" font-size="21" fill="#172c43" font-weight="700">统一查询与投影</text>
<text x="1008" y="606" font-size="17" fill="#40526a" font-weight="400">generation + evaluated_at</text>
<text x="1008" y="631" font-size="17" fill="#40526a" font-weight="400">各来源 freshness / warnings</text>
<text x="1008" y="656" font-size="17" fill="#40526a" font-weight="400">摘要优先、历史分页</text>
<rect x="50" y="770" width="400" height="125" rx="12" fill="#fff4e4" stroke="#c49245" stroke-width="1.5"/>
<text x="68" y="805" font-size="21" fill="#172c43" font-weight="700">必须保留</text>
<text x="68" y="831" font-size="17" fill="#40526a" font-weight="400">事件、路线修订、关联历史、水位</text>
<text x="68" y="856" font-size="17" fill="#40526a" font-weight="400">迁移溯源；外部一致性备份</text>
<text x="68" y="881" font-size="17" fill="#40526a" font-weight="400">损坏时停止写入并恢复</text>
<rect x="520" y="770" width="400" height="125" rx="12" fill="#edf1f6" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="538" y="805" font-size="21" fill="#172c43" font-weight="700">可以重新生成</text>
<text x="538" y="831" font-size="17" fill="#40526a" font-weight="400">当前 presence、Git 当前快照</text>
<text x="538" y="856" font-size="17" fill="#40526a" font-weight="400">从事实来源或持久记录重算</text>
<text x="538" y="881" font-size="17" fill="#40526a" font-weight="400">过期不代表完成</text>
<rect x="990" y="770" width="400" height="125" rx="12" fill="#eff0fc" stroke="#9295c8" stroke-width="1.5"/>
<text x="1008" y="805" font-size="21" fill="#172c43" font-weight="700">地图 / MCP / CLI</text>
<text x="1008" y="831" font-size="17" fill="#40526a" font-weight="400">同一查询契约，按需展示详情</text>
<text x="1008" y="856" font-size="17" fill="#40526a" font-weight="400">写命令回到统一接入层</text>
<text x="1008" y="881" font-size="17" fill="#40526a" font-weight="400">浏览器首轮只读</text>
<rect x="50" y="940" width="1340" height="60" rx="12" fill="#edf1f6" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="68" y="978" font-size="20" fill="#172c43" font-weight="700">运行方式</text>
<text x="215" y="978" font-size="17" fill="#40526a" font-weight="400">每仓库一个按需共享写核心；多个代理可连接。SQLite 替代多文件协议，不替代 Git。</text>
</g>
</svg>